[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-detection"
version = "0.1.0"
description = "Evaluation and engineering extension of an inherited skeleton-based fall-detection system"
license = {text = "MIT (this repository's own code only; see THIRD_PARTY_NOTICES.md)"}
requires-python = ">=3.10,<3.11"
# Pinned to the versions the recovered baseline was verified with (CPU, macOS arm64).
dependencies = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "numpy==1.26.4",
    "opencv-python==4.8.1.78",
    "scipy==1.11.4",
    "matplotlib==3.7.5",   # imported by inherited SPPE image utils
    "Pillow==10.2.0",
    "tqdm==4.66.1",        # imported by inherited detector utils
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["models: needs the fetched third-party code and model weights (scripts/fetch_third_party.py, scripts/setup_models.py)"]
